      <span class="price-field-label">Trigger price</span>
    </div>

      <div class="price-value-wrap" onclick="focusField('trigger')">

        <div class="cursor-line" id="triggerPriceCursor" style="visibility:hidden"></div>
      </div>
      <div class="trigger-from-market" id="triggerFromMarket">
        <span class="trigger-pct" id="triggerPctDisplay">+0.00%</span>
        <div class="trigger-from-label-wrap">
          <span class="trigger-from-text">from market</span>
          <div class="trigger-from-underline"></div>
        </div>
      </div>
    </div>
  </div>
